[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "astronotes-api"
version = "0.1.0"
description = "AstraVitals Ground Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "sqlalchemy[asyncio]>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "passlib[bcrypt]>=1.7.0",
    "python-jose[cryptography]>=3.3.0",
    "aiokafka>=0.8.0",
    "redis>=5.0.0",
    "pendulum>=4.0.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.23.0",
    "black>=23.0.0",
    "ruff>=0.3.0",
]

[tool.black]
line-length = 88

[tool.ruff]
select = ["I", "A", "B", "C", "E", "F", "W"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[project.scripts]
astronotes-api = "app.main:main"

[tool.setuptools]
package-data = { "": ["*.py", "*.json", "*.yaml", "*.yml"] }
include-package-data = true
