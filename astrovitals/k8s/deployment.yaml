apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrovitals
  labels:
    app: astrovitals
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astrovitals
  template:
    metadata:
      labels:
        app: astrovitals
    spec:
      containers:
        - name: nextjs
          image: astrovitals:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: database-url
            - name: NEXTAUTH_URL
              value: "http://localhost:3000"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: nextauth-secret
            - name: GITHUB_ID
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: github-id
            - name: GITHUB_SECRET
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: github-secret
            - name: GOOGLE_ID
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: google-id
            - name: GOOGLE_SECRET
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: google-secret
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: astrovitals
  labels:
    app: astrovitals
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: astrovitals
---
apiVersion: v1
kind: Service
metadata:
  name: astrovitals-loadbalancer
  labels:
    app: astrovitals
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: astrovitals
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: astrovitals-config
data:
  # Environment-specific configuration
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_NAME: "AstraVitals"
  # Feature flags
  NEXT_PUBLIC_ENABLE_CAMERA: "true"
  NEXT_PUBLIC_ENABLE_REALTIME: "true"
  NEXT_PUBLIC_ENABLE_GAMIFICATION: "true"