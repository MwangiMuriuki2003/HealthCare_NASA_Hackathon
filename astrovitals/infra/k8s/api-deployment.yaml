apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrovitals-api
  labels:
    app: astrovitals-api
    component: back-end
spec:
  replicas: 2
  selector:
    matchLabels:
      app: astrovitals-api
  template:
    metadata:
      labels:
        app: astrovitals-api
        component: back-end
    spec:
      containers:
        - name: api
          image: astrovitals-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: database-url
            - name: ASTRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: astra-api-key
            - name: ASTRA_ED25519_PUBLIC_KEY_B64
              valueFrom:
                secretKeyRef:
                  name: astrovitals-secrets
                  key: astra-ed25519-public-key-b64
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 12
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: astrovitals-api
  labels:
    app: astrovitals-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: astrovitals-api
---
apiVersion: v1
kind: Service
metadata:
  name: astrovitals-api-loadbalancer
  labels:
    app: astrovitals-api
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: astrovitals-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: astrovitals-config
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_NAME: "AstraVitals"
